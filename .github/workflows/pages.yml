name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check-site.py'
      - 'skills/catalog.txt'
      - 'package.json'
      - '.claude-plugin/plugin.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Same policy as CI: narrowest token, every action pinned to a commit. Only the
# deploy job can write to Pages, and only after the site check passes.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check site
        run: python3 scripts/check-site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
