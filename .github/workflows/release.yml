name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const tag = process.env.RELEASE_TAG.replace(/^v/, "");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const plugin = JSON.parse(
            fs.readFileSync(".claude-plugin/plugin.json", "utf8")
          ).version;
          const changelog = fs
            .readFileSync("CHANGELOG.md", "utf8")
            .match(/^## \[(\d+\.\d+\.\d+(?:-[^\]]+)?)\]/m)?.[1];
          for (const [source, version] of Object.entries({pkg, plugin, changelog})) {
            if (version !== tag) {
              throw new Error(`${source} version ${version} != tag ${tag}`);
            }
          }
          console.log(`release versions agree: ${tag}`);
          NODE
      - name: Run verify
        run: ./test.sh
      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="luciazero/" \
            -o "luciazero-${VERSION}.zip" HEAD
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" luciazero-*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" luciazero-*.zip \
              --generate-notes --verify-tag
          fi

  # Trusted publishing (OIDC): no NPM_TOKEN anywhere. Requires the one-time
  # npmjs.com side: package Settings -> Trusted Publisher -> GitHub Actions
  # (user: ohm41321, repo: luciazero, workflow: release.yml, no environment).
  # Provenance attestations are generated by default under OIDC.
  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24    # bundles npm >= 11.5.1, required for OIDC publish
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json (version-sync rule, last line of defense)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          [ "${PKG}" = "${TAG}" ] || { echo "package.json ${PKG} != tag ${TAG}" >&2; exit 1; }
      - name: Publish to npm (skipped when the version is already live)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$(npm view "luciazero@${PKG}" version 2>/dev/null)" = "${PKG}" ]; then
            echo "luciazero@${PKG} already on the registry — skipping"
            exit 0
          fi
          npm --version
          PACKAGE_STAGE="$(mktemp -d)"
          PACKAGE_DIR="$(./scripts/stage-npm-package.sh "${PACKAGE_STAGE}")"
          npm publish "${PACKAGE_DIR}"
