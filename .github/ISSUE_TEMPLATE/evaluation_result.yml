name: Evaluation result
description: Share A/B numbers from running eval/run.sh — replications welcome, null results doubly so
labels: [eval-result]
body:
  - type: markdown
    attributes:
      value: >
        The project's claims live or die on reproducible numbers, and one
        machine's runs are not enough. A result that shows *no* doctrine
        effect is as valuable as one that shows an effect — please post both.
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Provider, requested/observed model, reasoning effort, CLI version, Luciazero SHA, campaign ID and seed, task set, runs per arm, date, OS, and overrides if any.
      placeholder: |
        provider/model: codex / gpt-5.6-terra / medium
        luciazero: <git SHA>
        campaign/seed: terra-screen-v1 / 20260812
        tasks: all
        runs: 5 per arm
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: report.sh output
      description: Paste the rendered table from `eval/report.sh results.jsonl` — not hand-edited numbers. Raw JSONL is required before a result can be treated as published evidence.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that could bias the numbers — warm caches, prompt edits, aborted runs, INVALID counts.
    validations:
      required: false
