name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run verify
        run: ./test.sh
      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="luciazero/" \
            -o "luciazero-${VERSION}.zip" HEAD
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: luciazero-*.zip
          generate_release_notes: true

  # Trusted publishing (OIDC): no NPM_TOKEN anywhere. Requires the one-time
  # npmjs.com side: package Settings -> Trusted Publisher -> GitHub Actions
  # (user: ohm41321, repo: luciazero, workflow: release.yml, no environment).
  # Provenance attestations are generated by default under OIDC.
  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24    # bundles npm >= 11.5.1, required for OIDC publish
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json (version-sync rule, last line of defense)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          [ "${PKG}" = "${TAG}" ] || { echo "package.json ${PKG} != tag ${TAG}" >&2; exit 1; }
      - name: Publish to npm (skipped when the version is already live)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$(npm view "luciazero@${PKG}" version 2>/dev/null)" = "${PKG}" ]; then
            echo "luciazero@${PKG} already on the registry — skipping"
            exit 0
          fi
          npm --version
          npm publish
